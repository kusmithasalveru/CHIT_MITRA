version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: chitmitra_db
    environment:
      MYSQL_DATABASE: chit_mitra
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./backend
    container_name: chitmitra_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/chit_mitra?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: chitmitra_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
